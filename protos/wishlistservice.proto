syntax = "proto3";

package hipstershop;

option go_package = "github.com/GoogleCloudPlatform/microservices-demo/hipstershop";

// ---------------Wishlist service-----------------

service WishlistService {
    // Adds product to wishlist
    rpc AddToWishlist (AddToWishlistRequest) returns (Empty) {}

    // Retrieves full wishlist 
    rpc GetWishlist (GetWishlistRequest) returns (GetWishlistResponse) {}

    // Removes a product
    rpc RemoveFromWishlist (RemoveFromWishlistRequest) returns (Empty) {}

    // Empties wishlist
    rpc ClearWishlist (ClearWishlistRequest) returns (Empty) {}

    // Adds items to cart.
    rpc AddWishlistToCart (AddWishlistToCartRequest) returns (AddWishlistToCartResponse) {}

    // (Internal) Checks for price drops
    //NEED TO ADD PRICE DROP FUNCTION
    // This is meant to be called by a background scheduler
    //rpc CheckAndNotifySales (CheckAndNotifySalesRequest) returns (CheckAndNotifySalesResponse) {}
}

// --- Request and Response Messages ---

// Request to add item
message AddToWishlistRequest {
    string user_id = 1;      // The ID of the user (from the frontend session).
    string product_id = 2;   // The ID of the product to add (from productcatalogservice).
}

// Request to get wishlist.
message GetWishlistRequest {
    string user_id = 1;
}

// Response containing wishlist
message GetWishlistResponse {
    repeated WishlistItem items = 1; // A list of wishlist items with product details.
}

// Represents a single item in the wishlist
message WishlistItem {
    string product_id = 1;         // The product ID.
    string name = 2;              // Product name (from productcatalogservice).
    string description = 3;       // Product description.
    string picture = 4;           // Product image URL.
    Money price_usd = 5;          // Current product price in USD (reuses the Money type).
    bool is_on_sale = 6;          // Indicates if the item is currently discounted.
    string added_at = 7;          // Timestamp when the item was added to the wishlist (ISO 8601 format).
}

// Request to remove an item 
message RemoveFromWishlistRequest {
    string user_id = 1;
    string product_id = 2;
}

// Request to clear wishlist.
message ClearWishlistRequest {
    string user_id = 1;
}

// Request to add all wishlist items to cart.
message AddWishlistToCartRequest {
    string user_id = 1;
}

// Response for adding wishlist items to cart.
message AddWishlistToCartResponse {
    bool success = 1;            // True if all items were added successfully.
    string message = 2;          // A status message.
    int32 items_added_count = 3; // Number of items successfully moved to cart.
}

