name: CI - Build and Push Docker Images

on:
  workflow_dispatch:
  # En cada PR hacia main: construye y sube las imagenes (CI) para validar
  # que todo compila ANTES de aprobar. El deploy NO corre aqui.
  pull_request:
    branches:
      - main
  # Al hacer merge a main: CI + CD (deploy automatico al cluster EKS).
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: ./src/adservice
          - service: cartservice
            context: ./src/cartservice/src
          - service: checkoutservice
            context: ./src/checkoutservice
          - service: currencyservice
            context: ./src/currencyservice
          - service: emailservice
            context: ./src/emailservice
          - service: frontend
            context: ./src/frontend
          - service: paymentservice
            context: ./src/paymentservice
          - service: productcatalogservice
            context: ./src/productcatalogservice
          - service: recommendationservice
            context: ./src/recommendationservice
          - service: shippingservice
            context: ./src/shippingservice
          - service: loadgenerator
            context: ./src/loadgenerator
          # shoppingassistantservice (Google's GCP-coupled assistant) is gone:
          # replaced by accountservice + supportassistantservice below.
          - service: accountservice
            context: ./src/accountservice
          - service: supportassistantservice
            context: ./src/supportassistantservice
          - service: frontend-web
            context: ./src/frontend-web
            # Rutas relativas: el nginx de frontend-web las reenvia a cada
            # servicio dentro del cluster (ver src/frontend-web/nginx.conf).
            # Asi la misma imagen funciona con cualquier URL publica.
            build_args: |
              VITE_STORE_API_BASE_URL=/api/v1
              VITE_ACCOUNT_API_BASE_URL=/account
              VITE_SUPPORT_API_BASE_URL=/support

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # DevSecOps (Fase III): las credenciales ya NO viven en GitHub Secrets.
      # Se piden a HashiCorp Vault en tiempo de ejecución con un token de solo
      # lectura (politica online-boutique-ci). vault-action las enmascara en los logs.
      - name: Leer credenciales de AWS desde Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}
          caCertificate: ${{ secrets.VAULT_CA_CERT }}
          secrets: |
            kv/data/online-boutique/aws access_key_id     | AWS_ACCESS_KEY_ID ;
            kv/data/online-boutique/aws secret_access_key | AWS_SECRET_ACCESS_KEY ;
            kv/data/online-boutique/aws session_token     | AWS_SESSION_TOKEN

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/online-boutique/${{ matrix.service }}:latest
            ${{ steps.login-ecr.outputs.registry }}/online-boutique/${{ matrix.service }}:${{ github.sha }}

      - name: Resumen de la imagen
        run: |
          echo "Imagen publicada en ECR: \`online-boutique/${{ matrix.service }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-cd:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # DevSecOps (Fase III): credenciales de AWS + secretos de la aplicación
      # leídos de Vault en tiempo de ejecución (nunca guardados en GitHub).
      - name: Leer secretos desde Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}
          caCertificate: ${{ secrets.VAULT_CA_CERT }}
          secrets: |
            kv/data/online-boutique/aws access_key_id     | AWS_ACCESS_KEY_ID ;
            kv/data/online-boutique/aws secret_access_key | AWS_SECRET_ACCESS_KEY ;
            kv/data/online-boutique/aws session_token     | AWS_SESSION_TOKEN ;
            kv/data/online-boutique/app jwt_secret        | JWT_SECRET ;
            kv/data/online-boutique/app openai_api_key    | OPENAI_API_KEY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name online-boutique-cluster

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        id: deploy
        # --atomic: si algun pod no queda listo antes del timeout, Helm hace
        # ROLLBACK automatico a la version anterior y el job falla.
        run: |
          START=$(date +%s)
          # El chatbot no tiene API key real todavía: en Vault se guarda el
          # marcador "sin-configurar" y aquí se traduce a vacío.
          OPENAI_KEY="$OPENAI_API_KEY"
          [ "$OPENAI_KEY" = "sin-configurar" ] && OPENAI_KEY=""
          # Los secretos se pasan desde variables de entorno (inyectadas por
          # vault-action), nunca escritos en el YAML del workflow.
          helm upgrade --install onlineboutique ./helm-chart \
            -f helm-chart/values-aws.yaml \
            --set images.repository=${{ steps.login-ecr.outputs.registry }}/online-boutique \
            --set images.tag=${{ github.sha }} \
            --set-string jwtSecret="$JWT_SECRET" \
            --set-string openai.apiKey="$OPENAI_KEY" \
            --namespace default \
            --atomic --wait --timeout 10m
          echo "duration=$(( ($(date +%s) - START) / 60 )) min" >> $GITHUB_OUTPUT

      - name: Obtener la URL publica de la tienda
        id: url
        # AWS tarda 1-3 min en asignarle un hostname al Load Balancer.
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc frontend-web-external -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOST" ]; then break; fi
            echo "Esperando hostname del Load Balancer... ($i/30)"; sleep 10
          done
          if [ -z "$HOST" ]; then echo "::error::El Load Balancer no obtuvo hostname"; exit 1; fi
          echo "url=http://$HOST" >> $GITHUB_OUTPUT
          echo "Tienda publica: http://$HOST"

      - name: Smoke test - la tienda responde
        # El DNS del Load Balancer puede tardar unos minutos en propagarse.
        run: |
          URL="${{ steps.url.outputs.url }}"
          for i in $(seq 1 30); do
            WEB=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" || true)
            # El catalogo exige login (JWT): 401 = nginx SI llego al backend.
            # 502/503/504 = el proxy no alcanza al servicio.
            API=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/v1/products" || true)
            echo "web=$WEB api=$API"
            if [ "$WEB" = "200" ] && { [ "$API" = "200" ] || [ "$API" = "401" ]; }; then
              echo "OK: la tienda carga y el proxy llega al backend"; exit 0
            fi
            echo "Aun no responde... ($i/30)"; sleep 10
          done
          echo "::error::La tienda no respondio en $URL"; exit 1

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Despliegue en EKS"
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Tag de las imagenes | \`${{ github.sha }}\` |"
            echo "| Resultado | ${{ job.status }} |"
            echo "| Revision de Helm | $(helm history onlineboutique -n default --max 1 -o json 2>/dev/null | grep -o '\"revision\":[0-9]*' | cut -d: -f2) |"
            echo "| Duracion | ${{ steps.deploy.outputs.duration }} |"
            echo "| Tienda | ${{ steps.url.outputs.url }} |"
            echo "| Secretos | Leídos de HashiCorp Vault (kv/online-boutique/*) |"
          } >> $GITHUB_STEP_SUMMARY