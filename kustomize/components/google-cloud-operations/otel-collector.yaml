---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opentelemetrycollector
---
# The k8sattributes processor reads pod metadata from the API server to derive
# k8s.deployment.name (pod -> ReplicaSet -> Deployment) for each span it sees.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opentelemetrycollector
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opentelemetrycollector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opentelemetrycollector
subjects:
- kind: ServiceAccount
  name: opentelemetrycollector
  # Kustomize's namespace transformer rewrites this to match the overlay's
  # namespace, so deploying elsewhere needs no edit here.
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetrycollector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetrycollector
  template:
    metadata:
      labels:
        app: opentelemetrycollector
    spec:
      serviceAccountName: opentelemetrycollector
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      # Init container retrieves the current cloud project id from the metadata server
      # and inserts it into the collector config template
      # https://cloud.google.com/compute/docs/storing-retrieving-metadata
      initContainers:
      - name: otel-gateway-init
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command:
        - '/bin/sh'
        - '-c'
        - |
           sed "s/{{PROJECT_ID}}/$(wget -qO- --header 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/project/project-id)/" /template/collector-gateway-config-template.yaml >> /conf/collector-gateway-config.yaml
        volumeMounts:
        - name: collector-gateway-config-template
          mountPath: /template
        - name: collector-gateway-config
          mountPath: /conf
      containers:
      # This gateway container will receive traces and metrics from each microservice
      # and forward it to GCP
      - name: otel-gateway
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        args:
        - --config=/conf/collector-gateway-config.yaml
        image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
        volumeMounts:
        - name: collector-gateway-config
          mountPath: /conf
      volumes:
      # Simple ConfigMap volume with template file
      - name: collector-gateway-config-template
        configMap:
          items:
          - key: collector-gateway-config-template.yaml
            path: collector-gateway-config-template.yaml
          name: collector-gateway-config-template
      # Create a volume to store the expanded template (with correct cloud project ID)
      - name: collector-gateway-config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetrycollector
spec:
  ports:
  - name: grpc-otlp
    port: 4317
    protocol: TCP
    targetPort: 4317
  selector:
    app: opentelemetrycollector
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-gateway-config-template
# Open Telemetry Collector config
# https://opentelemetry.io/docs/collector/configuration/
data:
  collector-gateway-config-template.yaml: |
    extensions:
      # Authenticates to the Telemetry API with the collector's Application
      # Default Credentials (Workload Identity, or the node service account).
      googleclientauth:
        project: "{{PROJECT_ID}}"
        quota_project: "{{PROJECT_ID}}"
    receivers:
      otlp:
        protocols: 
          grpc:
    processors:
      # Resolves the sending pod from the connection source IP and attaches its
      # workload identity. k8s.deployment.name is the attribute App Topology
      # uses to key a GKE Deployment node.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
        - sources:
          - from: connection
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
      # Supplies cloud.provider, cloud.account.id, cloud.region /
      # cloud.availability_zone and k8s.cluster.name from the GKE metadata
      # server. override:false so it never clobbers what k8sattributes resolved.
      resourcedetection:
        detectors: [gcp]
        timeout: 10s
        override: false
        gcp:
          # This gateway describes its OWN pod, so host.* would label every
          # service's spans with the collector's node. k8sattributes already
          # supplies the real k8s.node.name for the sending pod.
          resource_attributes:
            host.id:
              enabled: false
            host.name:
              enabled: false
            host.type:
              enabled: false
      # The Telemetry API routes a request to a project using gcp.project_id and
      # rejects the whole batch with HTTP 400 "Resource is missing required
      # attribute" without it. resourcedetection supplies cloud.account.id,
      # which is what App Topology matches on, but not this one -- both are
      # needed, for different reasons.
      resource:
        attributes:
        - key: gcp.project_id
          value: "{{PROJECT_ID}}"
          action: upsert
      batch:
        send_batch_size: 200
        send_batch_max_size: 200
        timeout: 5s
    exporters:
      # Traces go to the Telemetry API so OpenTelemetry resource attributes
      # survive verbatim. Do not swap this back to the `googlecloud` exporter
      # without re-checking App Topology: the legacy Cloud Trace API rewrites
      # resource attributes into `g.co/r/...` span labels, which keeps traces
      # flowing while silently removing every runtime edge.
      otlphttp:
        endpoint: https://telemetry.googleapis.com
        encoding: proto
        auth:
          authenticator: googleclientauth
      googlecloud:
        project: "{{PROJECT_ID}}"
    service:
      extensions: [googleclientauth]
      pipelines:
        traces:
          receivers: [otlp] # Receive otlp-formatted data from other collector instances
          processors: [k8sattributes, resourcedetection, resource, batch]
          exporters: [otlphttp] # Export traces to the Telemetry (OTLP) API
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, resourcedetection, batch]
          exporters: [googlecloud] # Export metrics to Google Cloud